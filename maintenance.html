<!DOCTYPE html>
<html lang="en" class="site-checking">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>September Moon – We’ll be right back</title>
  <link rel="icon" href="/favicon.ico">
  <link rel="stylesheet" href="style.css?v=9">
  <style>
    .maintenance-shell{min-height:100vh;display:grid;place-items:center;padding:30px 16px}.maintenance-card{width:min(680px,100%);background:rgba(255,247,233,.94);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:clamp(28px,6vw,58px);text-align:center}.maintenance-logo{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:22px}.maintenance-logo .brand__icon{height:72px}.maintenance-logo .brand__word{height:58px}.maintenance-card h1{font-size:clamp(2.3rem,7vw,4.4rem);margin:.3rem 0 .8rem;line-height:1}.maintenance-card p{max-width:52ch;margin:0 auto;color:var(--muted);font-size:1.05rem;line-height:1.8}.maintenance-image{width:min(360px,100%);max-height:340px;object-fit:cover;border-radius:18px;border:1px solid var(--line);margin:26px auto 0;display:block}.maintenance-note{margin-top:28px!important;font-size:.86rem!important}.maintenance-note a{color:var(--accent);font-weight:800}
  </style>
  <script>setTimeout(()=>document.documentElement.classList.remove('site-checking'),3000)</script>
  <script type="module" src="js/site.js?v=1"></script>
</head>
<body data-maintenance-page="true">
  <main class="maintenance-shell">
    <section class="maintenance-card">
      <div class="maintenance-logo">
        <img src="nlogo.png" alt="" class="brand__icon">
        <img src="nlword.png" alt="September Moon" class="brand__word">
      </div>
      <p class="eyebrow">September Moon</p>
      <h1 data-maintenance-title>We’ll be right back</h1>
      <p data-maintenance-message>We’re making the website a little more magical. Please check back soon.</p>
      <img data-maintenance-image class="maintenance-image" alt="" hidden>
      <p class="maintenance-note">Need us in the meantime? <a href="mailto:septembermoonclothing@gmail.com">Send us an email</a>.</p>
    </section>
  </main>
</body>
</html>
