<!DOCTYPE html>
<html lang="en" class="site-checking">
<head>
  <meta charset="UTF-8">
  <title>Collections – September Moon</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css?v=9">
  <link rel="icon" href="/favicon.ico">
  <script>setTimeout(()=>document.documentElement.classList.remove('site-checking'),3000)</script>
  <script type="module" src="js/site.js?v=1"></script>
</head>
<body>
  <header class="header">
    <div class="container header__inner">
      <a class="brand" href="index.html" aria-label="September Moon home">
        <img src="nlogo.png" alt="" class="brand__icon">
        <img src="nlword.png" alt="September Moon" class="brand__word">
      </a>
      <button class="menuBtn" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="collections.html">Collections</a>
        <a href="Coming-Soon.html">Coming Soon</a>
        <a href="story.html">Our story</a>
        <a href="faq.html">FAQ</a>
        <a class="nav__cta" href="index.html#contact">Contact</a>
      </nav>
    </div>
  </header>

  <section class="section">
    <div class="container">
      <div class="section__head">
        <h1>Collections</h1>
        <p>Explore our curated dresses and special pieces</p>
      </div>
      <div class="grid grid--4" data-product-grid="in-stock">
        <p class="catalog-empty">Loading collection…</p>
      </div>
    </div>
  </section>

  <script>
    const btn=document.querySelector('.menuBtn');const nav=document.querySelector('.nav');
    btn?.addEventListener('click',()=>{const open=nav.classList.toggle('nav--open');btn.setAttribute('aria-expanded',open?'true':'false')});
  </script>
</body>
</html>
